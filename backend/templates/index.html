<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Anubis-Scan | Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border: 1px solid #333; color: white; }
        .table { color: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">🛡️ Anubis-Scan Engine</h1>
        
        <div class="card p-4 mb-4">
            <form action="/web/add" method="post" class="row g-3">
                <div class="col-auto">
                    <input type="text" name="url" class="form-control" placeholder="https://ejemplo.com" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Agregar Objetivo</button>
                </div>
            </form>
        </div>

        <div class="card p-4">
            <h3>Objetivos Registrados</h3>
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>URL</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for t in targets %}
                    <tr>
                        <td>{{ t.id }}</td>
                        <td>{{ t.url }}</td>
                        <td><span class="badge bg-info">{{ t.status }}</span></td>
                        <td>
                            <form action="/web/scan/{{ t.id }}" method="post" style="display:inline;">
                                <button class="btn btn-sm btn-warning">🚀 Escanear</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
